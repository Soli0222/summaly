name: Lint

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1
      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.0
        with:
          version: 12.16.0
          run_install: false
      - name: Use Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: 26.13.0
          cache: 'pnpm'
      - name: Install
        run: |
          pnpm i --frozen-lockfile
      - name: eslint
        run: |
          pnpm eslint
